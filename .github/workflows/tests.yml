name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      systemes:
        description: Systèmes à tester
        type: choice
        default: tous
        options: [tous, linux, windows, macos]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit tests and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  desktop:
    name: Desktop app on ${{ matrix.name }} (Ollama simulated)
    needs: unit
    # Dépôt privé : minutes macOS comptées dix fois ; ces tests ne tournent alors que sur demande
    # (onglet Actions → « Run workflow »). Dépôt public : à chaque envoi.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            family: macos
            os: macos-15
            build: --mac zip --arm64
          - name: macOS Intel
            family: macos
            os: macos-15-intel
            build: --mac zip --x64
          - name: Windows
            family: windows
            os: windows-latest
            build: --win nsis zip --x64
          - name: Linux
            family: linux
            os: ubuntu-latest
            build: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        uses: actions/checkout@v5
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm ci
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm test
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: mkdir -p test-results
      # Linux : Electron a besoin d'un écran (virtuel, Xvfb) et des espaces de noms utilisateur
      # que la protection AppArmor d'Ubuntu restreint par défaut.
      - if: runner.os == 'Linux' && (!inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 &
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:features
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:pdf
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:encryption
      # Application construite puis testée telle qu'elle sera distribuée.
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npx electron-builder ${{ matrix.build }} --publish never
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:pdf
        env:
          LOCALIA_PACKAGED: '1'
      - name: Keep screenshots
        if: ${{ always() && (!inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family) }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        name: Keep the application
        uses: actions/upload-artifact@v4
        with:
          name: Localia-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
