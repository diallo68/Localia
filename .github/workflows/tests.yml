name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      systemes:
        description: Systèmes à tester
        type: choice
        default: tous
        options: [tous, linux, windows, macos, foundry]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit tests and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  desktop:
    name: Desktop app on ${{ matrix.name }} (Ollama simulated)
    needs: unit
    # Dépôt privé : minutes macOS comptées dix fois ; ces tests ne tournent alors que sur demande
    # (onglet Actions → « Run workflow »). Dépôt public : à chaque envoi.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            family: macos
            os: macos-15
            build: --mac zip --arm64
          - name: macOS Intel
            family: macos
            os: macos-15-intel
            build: --mac zip --x64
          - name: Windows
            family: windows
            os: windows-latest
            build: --win nsis zip --x64
          - name: Linux
            family: linux
            os: ubuntu-latest
            build: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    # Un test bloqué s'arrête au bout de 45 min (sinon GitHub attend 6 h, minutes comptées).
    timeout-minutes: 45
    steps:
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        uses: actions/checkout@v5
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm ci
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm test
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: mkdir -p test-results
      # Linux : Electron a besoin d'un écran (virtuel, Xvfb) et des espaces de noms utilisateur
      # que la protection AppArmor d'Ubuntu restreint par défaut.
      - if: runner.os == 'Linux' && (!inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 &
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:features
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:pdf
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:encryption
      # Foundry Local (Microsoft) simulé : service local au format d'OpenAI.
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:foundry
      # Moteur intégré réel : petit modèle de test (105 Mo, gardé en cache entre les passages).
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/localia-test-models
          key: modele-test-smollm2-135m-q4km
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:engine
      # Application construite puis testée telle qu'elle sera distribuée.
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npx electron-builder ${{ matrix.build }} --publish never
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:pdf
        env:
          LOCALIA_PACKAGED: '1'
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        run: npm run test:engine
        env:
          LOCALIA_PACKAGED: '1'
      - name: Keep screenshots
        if: ${{ always() && (!inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family) }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
      - if: ${{ !inputs.systemes || inputs.systemes == 'tous' || inputs.systemes == matrix.family }}
        name: Keep the application
        uses: actions/upload-artifact@v4
        with:
          name: Localia-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  foundry:
    name: Foundry Local réel (Windows)
    needs: unit
    # Sur demande seulement : installe Foundry Local et télécharge un petit modèle (~500 Mo).
    if: github.event_name == 'workflow_dispatch' && (inputs.systemes == 'tous' || inputs.systemes == 'windows' || inputs.systemes == 'foundry')
    runs-on: windows-latest
    timeout-minutes: 40
    # Foundry Local est en préversion : un échec ici ne bloque pas les autres tests.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Foundry Local
        shell: pwsh
        run: |
          winget install --id Microsoft.FoundryLocal --exact --silent --accept-source-agreements --accept-package-agreements
          $dir = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps'
          echo $dir >> $env:GITHUB_PATH
          & (Join-Path $dir 'foundry.exe') --version
      - name: Download a small model
        shell: pwsh
        run: |
          foundry model download qwen2.5-0.5b
      # Relevé de ce que répond le service (versions de Foundry Local en évolution).
      - name: Foundry Local diagnostics
        shell: pwsh
        continue-on-error: true
        run: |
          foundry --version
          foundry server status
          $url = ((foundry server status) | Select-String -Pattern 'http://[^\s)]+' | Select-Object -First 1).Matches.Value
          if ($url) { $base = ([uri]$url).GetLeftPart('Authority') } else { $base = '' }
          echo "Service : $base"
          foreach ($route in '/v1/models', '/openai/models', '/openai/loadedmodels', '/openai/status', '/models/loaded') {
            try { $r = Invoke-WebRequest -UseBasicParsing "$base$route"; echo "$route -> $($r.StatusCode) $($r.Content.Substring(0, [Math]::Min(300, $r.Content.Length)))" }
            catch { echo "$route -> $($_.Exception.Message)" }
          }
      - run: npm run test:foundry-real
